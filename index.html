<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flash anzan</title>
<style>
:root{--bg1:#6d3cf0;--bg2:#2d1b78;--card:rgba(255,255,255,.16);--text:#fff;--muted:#e0d8ff;--accent:#ffd23f;--ok:#22c55e;--bad:#ef4444;--chip:rgba(255,255,255,.18);--chipon:#fff;--chiptext:#2d1b78;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3b1fa0;--bg2:#120a3a;--card:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg1:#3b1fa0;--bg2:#120a3a;--card:rgba(255,255,255,.1)}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:16px;display:flex;flex-direction:column;min-height:100%}
header{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.pill{background:var(--card);border-radius:999px;padding:6px 14px}
h1{font-size:22px;margin:14px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);color:var(--text);border:0;border-radius:12px;padding:10px 16px;font-size:16px;font-weight:600}
.chip.on{background:var(--chipon);color:var(--chiptext)}
.big{width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:800;color:#fff;background:var(--ok);margin-top:auto}
.screen{display:none;flex:1;flex-direction:column}
.screen.show{display:flex}
#num{flex:1;display:flex;align-items:center;justify-content:center;font-size:30vmin;font-weight:900;transition:color .1s}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
#ans{width:80%;font-size:36px;text-align:center;border-radius:16px;border:0;padding:14px;background:#fff;color:#2d1b78;font-weight:800}
.emoji{font-size:80px}
.res{font-size:22px;font-weight:800}
</style>
</head>
<body>
<div id="app">
  <header><span>🦉 Flash anzan</span><span class="pill">🪙 <span id="coins">0</span></span></header>

  <section id="s-set" class="screen show">
    <h1>Sozlamalar</h1>
    <p class="sub">O‘yinni o‘zingizga moslang</p>
    <div class="card"><h3>Nechta son</h3><div class="chips" data-k="n"><button class="chip" data-v="3">3</button><button class="chip on" data-v="5">5</button><button class="chip" data-v="7">7</button><button class="chip" data-v="10">10</button></div></div>
    <div class="card"><h3>Tezlik (har bir son)</h3><div class="chips" data-k="speed"><button class="chip" data-v="2">2 s</button><button class="chip" data-v="1.5">1.5 s</button><button class="chip on" data-v="1">1 s</button><button class="chip" data-v="0.7">0.7 s</button><button class="chip" data-v="0.5">0.5 s</button></div></div>
    <div class="card"><h3>Son xonasi</h3><div class="chips" data-k="digits"><button class="chip on" data-v="1">1 xonali</button><button class="chip" data-v="2">2 xonali</button></div></div>
    <div class="card"><h3>Amal</h3><div class="chips" data-k="mode"><button class="chip on" data-v="add">Faqat qo‘shish</button><button class="chip" data-v="mix">Qo‘shish va ayirish</button></div></div>
    <button class="big" id="start">💡 Boshlash</button>
  </section>

  <section id="s-flash" class="screen"><div id="num"></div></section>

  <section id="s-ans" class="screen">
    <div class="center">
      <div class="res">Yig‘indi nechta?</div>
      <input id="ans" type="number" inputmode="numeric" autocomplete="off">
    </div>
    <button class="big" id="check">Tekshirish</button>
  </section>

  <section id="s-res" class="screen">
    <div class="center">
      <div class="emoji" id="r-emoji"></div>
      <div class="res" id="r-text"></div>
      <div id="r-seq" class="sub"></div>
    </div>
    <button class="big" id="again">🔁 Yana o‘ynash</button>
  </section>
</div>

<script>
var cfg = { n: 5, speed: 1, digits: 1, mode: "add" };
var seq = [], total = 0, coins = 0, timers = [];
var COLORS = ["#ffd23f", "#4ade80", "#38bdf8", "#f472b6", "#fb923c"];

try { coins = parseInt(localStorage.getItem("anzan_coins") || "0", 10) || 0; } catch (e) { coins = 0; }
function saveCoins() {
  document.getElementById("coins").textContent = coins;
  try { localStorage.setItem("anzan_coins", String(coins)); } catch (e) {}
}
saveCoins();

function show(id) {
  var all = document.querySelectorAll(".screen");
  for (var i = 0; i < all.length; i++) all[i].classList.remove("show");
  document.getElementById(id).classList.add("show");
}

document.querySelectorAll(".chips").forEach(function (box) {
  box.addEventListener("click", function (ev) {
    var b = ev.target.closest(".chip");
    if (!b) return;
    box.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("on"); });
    b.classList.add("on");
    var k = box.getAttribute("data-k"), v = b.getAttribute("data-v");
    cfg[k] = (k === "mode") ? v : parseFloat(v);
  });
});

function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

function makeSeq() {
  var lo = cfg.digits === 1 ? 1 : 10, hi = cfg.digits === 1 ? 9 : 99;
  seq = []; total = 0;
  for (var i = 0; i < cfg.n; i++) {
    var v = rnd(lo, hi), sign = 1;
    if (i > 0 && cfg.mode === "mix" && Math.random() < 0.4 && total - v >= 0) sign = -1;
    seq.push(sign * v);
    total += sign * v;
  }
}

function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function play() {
  clearTimers();
  makeSeq();
  show("s-flash");
  var el = document.getElementById("num");
  var ms = cfg.speed * 1000, t = 0;
  el.style.color = "#fff"; el.textContent = "3";
  [2, 1].forEach(function (c, i) {
    timers.push(setTimeout(function () { el.textContent = String(c); }, (i + 1) * 700));
  });
  t = 3 * 700;
  seq.forEach(function (v, i) {
    timers.push(setTimeout(function () {
      el.style.color = COLORS[i % COLORS.length];
      el.textContent = (v < 0 ? "−" : (i > 0 && cfg.mode === "mix" ? "+" : "")) + Math.abs(v);
    }, t));
    timers.push(setTimeout(function () { el.textContent = ""; }, t + ms * 0.8));
    t += ms;
  });
  timers.push(setTimeout(function () {
    show("s-ans");
    var a = document.getElementById("ans");
    a.value = "";
    a.focus();
  }, t + 200));
}

function check() {
  var raw = document.getElementById("ans").value;
  if (raw === "") return;
  var ok = parseInt(raw, 10) === total;
  var gain = ok ? cfg.n * (cfg.digits === 2 ? 3 : 1) + Math.round((2 - Math.min(cfg.speed, 2)) * 5) : 0;
  coins += gain;
  saveCoins();
  document.getElementById("r-emoji").textContent = ok ? "🎉" : "😅";
  document.getElementById("r-text").textContent = ok ? "To‘g‘ri! +" + gain + " tanga" : "Xato. To‘g‘ri javob: " + total;
  document.getElementById("r-seq").textContent = seq.map(function (v, i) {
    return (i === 0 ? "" : (v < 0 ? " − " : " + ")) + Math.abs(v);
  }).join("") + " = " + total;
  show("s-res");
}

document.getElementById("start").addEventListener("click", play);
document.getElementById("check").addEventListener("click", check);
document.getElementById("ans").addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
document.getElementById("again").addEventListener("click", function () { clearTimers(); show("s-set"); });
</script>
</body>
</html>
