<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zehniylar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,#6d3cf0,#2d1b78);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#brand{text-align:center;font-size:22px;font-weight:900;letter-spacing:.5px;color:#ffd23f;padding:12px 16px 0}
#top{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;font-weight:700}
.pill{background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.bar{flex:1;height:8px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#ffd23f}
#view{flex:1;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column}
#nav{display:flex;background:rgba(0,0,0,.3);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;background:none;border:0;color:#cfc6ff;padding:10px 0;font-size:11px}
#nav button.on{color:#fff;font-weight:800}
#nav span{display:block;font-size:22px}
h1{font-size:22px;margin:8px 0}
h2{font-size:15px;margin:14px 0 8px;color:#e0d8ff}
.card{background:rgba(255,255,255,.16);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;width:100%;border:0;color:#fff;text-align:left;font-size:16px;font-weight:700}
.card small{display:block;font-weight:400;color:#e0d8ff;font-size:13px}
.card .ic{font-size:30px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-size:16px;font-weight:600}
.chip.on{background:#fff;color:#2d1b78}
.big{width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:800;color:#fff;background:#22c55e;margin-top:auto}
.opt{width:100%;border:0;border-radius:14px;padding:16px;font-size:20px;font-weight:700;background:#fff;color:#2d1b78;margin-bottom:10px}
.opt.ok{background:#22c55e;color:#fff}
.opt.no{background:#ef4444;color:#fff}
.q{text-align:center;font-size:56px;font-weight:900;margin:14px 0;min-height:90px}
.q small{display:block;font-size:16px;font-weight:400;color:#e0d8ff}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
#num{font-size:30vmin;font-weight:900}
#ans{width:80%;font-size:36px;text-align:center;border-radius:16px;border:0;padding:14px;background:#fff;color:#2d1b78;font-weight:800}
.back{background:none;border:0;color:#e0d8ff;font-size:15px;padding:6px 0;text-align:left}
.row{display:flex;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,.12);border-radius:12px;margin-bottom:6px}
.row.me{background:#ffd23f;color:#2d1b78;font-weight:800}
#cv{display:block;margin:0 auto;border-radius:12px;touch-action:none;background:#1b1146}
.pad{display:flex;justify-content:center;gap:10px;margin-top:10px}
.pad button{width:64px;height:50px;font-size:22px;border:0;border-radius:14px;background:rgba(255,255,255,.2);color:#fff}
.rope{display:flex;align-items:center;gap:8px;font-size:28px;margin:14px 0 22px}
.track{flex:1;height:14px;background:rgba(255,255,255,.2);border-radius:9px;position:relative}
.track i{position:absolute;top:-10px;font-style:normal;font-size:26px;transition:left .3s;transform:translateX(-50%)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:20px;z-index:9}
#modal>div{background:#2d1b78;border-radius:20px;padding:20px;max-width:360px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="brand">🦉 Zehniylar</div>
  <div id="top"></div>
  <div id="view"></div>
  <div id="nav">
    <button data-t="math" onclick="nav('math')"><span>🧮</span>Mental</button>
    <button data-t="games" onclick="nav('games')"><span>🎮</span>O‘yinlar</button>
    <button data-t="top" onclick="nav('top')"><span>🏆</span>Reyting</button>
    <button data-t="me" onclick="nav('me')"><span>👤</span>Profil</button>
  </div>
</div>
<div id="modal"><div>
  <h1>👑 Premium</h1>
  <p>Bepul: kuniga 15 daqiqa.<br>Premium: cheksiz vaqt va ×2 tanga.</p>
  <button class="big" onclick="buy()">👑 Premium sotib olish</button>
  <button class="back" style="margin-top:10px" onclick="closeModal()">Yopish</button>
</div></div>

<script>
var ADMIN = "";          // Premium uchun admin Telegram username (@siz), masalan "baxt_admin"
var PREMIUM = false, LIMIT = 900;
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

var S = { coins: 0, day: "", sec: 0 };
try { var raw = localStorage.getItem("zm_state"); if (raw) S = JSON.parse(raw); } catch (e) {}
function today() { return new Date().toISOString().slice(0, 10); }
if (S.day !== today()) { S.day = today(); S.sec = 0; }
function save() { try { localStorage.setItem("zm_state", JSON.stringify(S)); } catch (e) {} }

function $(id) { return document.getElementById(id); }
function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = rnd(0, i), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function lvl() { return Math.floor(S.coins / 100) + 1; }
function head() {
  $("top").innerHTML = '<span class="pill">⭐ ' + lvl() + '-daraja</span><div class="bar"><i style="width:' + (S.coins % 100) + '%"></i></div><span class="pill">🪙 ' + S.coins + '</span>';
}
function add(n) { S.coins += PREMIUM ? n * 2 : n; save(); head(); }

var playing = false, timers = [];
function stopAll() { playing = false; timers.forEach(clearTimeout); timers = []; if (window.speechSynthesis) speechSynthesis.cancel(); }
function view(h) { $("view").innerHTML = h; $("view").scrollTop = 0; }
function card(i, t, s, f) { return '<button class="card" onclick="' + f + '"><span class="ic">' + i + '</span><span>' + t + '<small>' + s + '</small></span></button>'; }
function backBtn(f) { return '<button class="back" onclick="' + f + '">← Orqaga</button>'; }

function nav(t) {
  stopAll();
  var b = document.querySelectorAll("#nav button");
  for (var i = 0; i < b.length; i++) b[i].className = b[i].getAttribute("data-t") === t ? "on" : "";
  if (t === "math") mental(); else if (t === "games") home(); else if (t === "top") ranking(); else profile();
}

function gate() { if (!PREMIUM && S.sec >= LIMIT) { showModal(); return false; } return true; }
function showModal() { stopAll(); $("modal").style.display = "flex"; }
function closeModal() { $("modal").style.display = "none"; nav("games"); }
function buy() {
  if (ADMIN) { var u = "https://t.me/" + ADMIN; if (tg && tg.openTelegramLink) tg.openTelegramLink(u); else window.open(u); }
  else alert("Admin bilan bog‘laning");
}
setInterval(function () { if (playing && !PREMIUM) { S.sec++; save(); if (S.sec >= LIMIT) showModal(); } }, 1000);

function home() {
  stopAll();
  view('<h1>O‘yinlar</h1>' +
    card("🐍", "Ilon", "To‘g‘ri sonni yeng, ilon o‘sadi", "snakeStart()") +
    card("🪢", "Arqon tortish", "Kompyuterga qarshi tez hisoblang", "tugStart()") +
    card("🇬🇧", "Ingliz tili", "Hayvonlar, ranglar, sonlar", "lang('en')") +
    card("📗", "Arab tili", "Alifbo, hayvonlar, ranglar, sonlar", "lang('ar')"));
}
function mental() {
  stopAll();
  view('<h1>Mental arifmetika</h1>' +
    card("⚡", "Flash anzan", "Sonlar chaqnaydi, yig‘indini toping", "anzanSet()") +
    card("🧠", "Tez hisob", "To‘g‘ri javobni tanlang", "startQuiz(mathQ,'Tez hisob',mental)"));
}

/* ---------- Viktorina mexanizmi ---------- */
var Q = {};
function startQuiz(gen, title, back, lang) {
  if (!gate()) return;
  Q = { n: 10, i: 0, ok: 0, gen: gen, title: title, back: back, lang: lang || "", lock: false };
  playing = true; nextQ();
}
function nextQ() {
  if (Q.i >= Q.n) return endQuiz();
  Q.cur = Q.gen(); Q.lock = false;
  var h = backBtn("quitQuiz()") + '<h2>' + Q.title + ' · ' + (Q.i + 1) + '/' + Q.n + '</h2><div class="q">' + Q.cur.p + '</div>';
  Q.cur.o.forEach(function (x, k) { h += '<button class="opt" id="o' + k + '" onclick="pick(' + k + ')">' + x + '</button>'; });
  view(h);
  if (Q.cur.say) speak(Q.cur.say, Q.lang);
}
function pick(k) {
  if (Q.lock) return; Q.lock = true;
  var ok = k === Q.cur.a;
  $("o" + k).className = "opt " + (ok ? "ok" : "no");
  if (!ok) $("o" + Q.cur.a).className = "opt ok";
  if (ok) { Q.ok++; add(2); }
  Q.i++;
  timers.push(setTimeout(nextQ, ok ? 600 : 1200));
}
function endQuiz() {
  playing = false;
  view('<div class="mid"><div style="font-size:70px">' + (Q.ok >= 8 ? "🏆" : Q.ok >= 5 ? "🎉" : "💪") + '</div><h1>' + Q.ok + ' / ' + Q.n + '</h1><div>+' + Q.ok * 2 * (PREMIUM ? 2 : 1) + ' tanga</div></div>' +
    '<button class="big" onclick="again()">🔁 Yana o‘ynash</button><button class="back" style="margin-top:10px;text-align:center" onclick="quitQuiz()">Orqaga</button>');
}
function again() { startQuiz(Q.gen, Q.title, Q.back, Q.lang); }
function quitQuiz() { stopAll(); Q.back(); }
function speak(t, l) {
  try { if (!window.speechSynthesis) return; speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = l; speechSynthesis.speak(u); } catch (e) {}
}
function replay() { speak(Q.cur.say, Q.lang); }

function mathQ() {
  var a = rnd(2, 20), b = rnd(2, 12), op = ["+", "−", "×", "÷"][rnd(0, 3)], r;
  if (op === "×") { a = rnd(2, 9); r = a * b; }
  else if (op === "÷") { r = rnd(2, 9); b = rnd(2, 9); a = r * b; }
  else if (op === "+") r = a + b;
  else { if (b > a) { var t = a; a = b; b = t; } r = a - b; }
  var s = {}; s[r] = 1; var o = [r];
  while (o.length < 4) { var w = r + rnd(-5, 5); if (w >= 0 && !s[w]) { s[w] = 1; o.push(w); } }
  shuffle(o);
  return { p: a + " " + op + " " + b + " = ?", o: o, a: o.indexOf(r) };
}

/* ---------- Tillar ---------- */
var D = {
  en: { say: "en-US", t: [
    ["Hayvonlar", "🐾", "cat||mushuk|🐱;dog||it|🐶;bird||qush|🐦;fish||baliq|🐟;horse||ot|🐴;cow||sigir|🐮;sheep||qo‘y|🐑;lion||sher|🦁"],
    ["Ranglar", "🎨", "red||qizil|🔴;blue||ko‘k|🔵;green||yashil|🟢;yellow||sariq|🟡;black||qora|⚫;white||oq|⚪;orange||to‘q sariq|🟠;purple||binafsha|🟣"],
    ["Sonlar", "🔢", "one||bir|1️⃣;two||ikki|2️⃣;three||uch|3️⃣;four||to‘rt|4️⃣;five||besh|5️⃣;six||olti|6️⃣;seven||yetti|7️⃣;eight||sakkiz|8️⃣"]
  ] },
  ar: { say: "ar-SA", t: [
    ["Alifbo", "🔤", "ا||Alif|;ب||Ba|;ت||Ta|;ث||Sa|;ج||Jim|;ح||Ha|;خ||Xa|;د||Dal|;ذ||Zal|;ر||Ra|;ز||Zay|;س||Sin|;ش||Shin|;ص||Sod|;ض||Dod|;ط||To|;ظ||Zo|;ع||Ayn|;غ||G‘ayn|;ف||Fa|;ق||Qof|;ك||Kof|;ل||Lam|;م||Mim|;ن||Nun|;ه||Ho|;و||Vov|;ي||Ya|"],
    ["Hayvonlar", "🐾", "قطة|qitta|mushuk|🐱;كلب|kalb|it|🐶;طائر|toir|qush|🐦;سمكة|samaka|baliq|🐟;حصان|hisan|ot|🐴;بقرة|baqara|sigir|🐮;خروف|xarouf|qo‘y|🐑;أسد|asad|sher|🦁"],
    ["Ranglar", "🎨", "أحمر|ahmar|qizil|🔴;أزرق|azraq|ko‘k|🔵;أخضر|axdar|yashil|🟢;أصفر|asfar|sariq|🟡;أسود|aswad|qora|⚫;أبيض|abyad|oq|⚪;برتقالي|burtuqoliy|to‘q sariq|🟠;بنفسجي|banafsajiy|binafsha|🟣"],
    ["Sonlar", "🔢", "واحد|vohid|bir|1️⃣;اثنان|isnan|ikki|2️⃣;ثلاثة|salasa|uch|3️⃣;أربعة|arbaa|to‘rt|4️⃣;خمسة|xamsa|besh|5️⃣;ستة|sitta|olti|6️⃣;سبعة|sabaa|yetti|7️⃣;ثمانية|samoniya|sakkiz|8️⃣"]
  ] }
};
var cur = { l: "en", i: 0 };
function items(l, i) { return D[l].t[i][2].split(";").map(function (s) { var p = s.split("|"); return { w: p[0], t: p[1], u: p[2], e: p[3] }; }); }
function lang(l) {
  stopAll();
  var h = backBtn("home()") + '<h1>' + (l === "en" ? "Ingliz tili" : "Arab tili") + '</h1>';
  D[l].t.forEach(function (t, i) { h += card(t[1], t[0], "O‘yin turini tanlang", "topic('" + l + "'," + i + ")"); });
  view(h);
}
function topic(l, i) {
  stopAll(); cur = { l: l, i: i };
  var t = D[l].t[i];
  view(backBtn("lang('" + l + "')") + '<h1>' + t[1] + ' ' + t[0] + '</h1>' +
    card("🖼️", "Rasm va so‘z", "Mosini toping", "pl('pic')") +
    card("🔊", "Tingla va top", "Eshitib, ma‘nosini toping", "pl('listen')") +
    card("📖", "O‘qi va top", "So‘zni o‘qing, ma‘nosini toping", "pl('read')"));
}
function pl(m) {
  var its = items(cur.l, cur.i);
  startQuiz(function () { return wordQ(its, m); }, D[cur.l].t[cur.i][0], function () { topic(cur.l, cur.i); }, D[cur.l].say);
}
function lab(x) { return (x.e ? x.e + " " : "") + x.u; }
function wordQ(its, m) {
  var c = its[rnd(0, its.length - 1)], o = [c], k;
  while (o.length < 4) { k = its[rnd(0, its.length - 1)]; if (o.indexOf(k) < 0) o.push(k); }
  shuffle(o);
  var r = { a: o.indexOf(c) };
  if (m === "pic") { r.p = c.e || c.u; r.o = o.map(function (x) { return x.w; }); }
  else if (m === "listen") { r.p = '<span onclick="replay()">🔊</span>'; r.say = c.w; r.o = o.map(lab); }
  else { r.p = c.w + (c.t ? '<small>' + c.t + '</small>' : ""); r.o = o.map(lab); }
  return r;
}

/* ---------- Flash anzan ---------- */
var A = { n: 5, sp: 1, d: 1, m: "add" }, seq = [], tot = 0, COL = ["#ffd23f", "#4ade80", "#38bdf8", "#f472b6", "#fb923c"];
function chips(k, vs, ls) {
  var h = '<div class="chips">';
  vs.forEach(function (v, i) { h += '<button class="chip' + (A[k] === v ? " on" : "") + '" onclick="setA(\'' + k + '\',' + JSON.stringify(v).replace(/"/g, "&quot;") + ')">' + ls[i] + '</button>'; });
  return h + '</div>';
}
function setA(k, v) { A[k] = v; anzanSet(); }
function anzanSet() {
  stopAll();
  view(backBtn("mental()") + '<h1>Flash anzan</h1><h2>Nechta son</h2>' + chips("n", [3, 5, 7, 10], ["3", "5", "7", "10"]) +
    '<h2>Tezlik (har bir son)</h2>' + chips("sp", [2, 1.5, 1, 0.7, 0.5], ["2 s", "1.5 s", "1 s", "0.7 s", "0.5 s"]) +
    '<h2>Son xonasi</h2>' + chips("d", [1, 2], ["1 xonali", "2 xonali"]) +
    '<h2>Amal</h2>' + chips("m", ["add", "mix"], ["Faqat qo‘shish", "Qo‘shish va ayirish"]) +
    '<button class="big" style="margin-top:20px" onclick="anzanPlay()">💡 Boshlash</button>');
}
function anzanPlay() {
  if (!gate()) return;
  stopAll(); playing = true;
  var lo = A.d === 1 ? 1 : 10, hi = A.d === 1 ? 9 : 99;
  seq = []; tot = 0;
  for (var i = 0; i < A.n; i++) {
    var v = rnd(lo, hi), s = 1;
    if (i > 0 && A.m === "mix" && Math.random() < 0.4 && tot - v >= 0) s = -1;
    seq.push(s * v); tot += s * v;
  }
  view('<div class="mid"><div id="num">3</div></div>');
  var el = $("num"), ms = A.sp * 1000, t = 2100;
  timers.push(setTimeout(function () { el.textContent = "2"; }, 700), setTimeout(function () { el.textContent = "1"; }, 1400));
  seq.forEach(function (v, i) {
    timers.push(setTimeout(function () { el.style.color = COL[i % 5]; el.textContent = (v < 0 ? "−" : (i > 0 && A.m === "mix" ? "+" : "")) + Math.abs(v); }, t));
    timers.push(setTimeout(function () { el.textContent = ""; }, t + ms * 0.8));
    t += ms;
  });
  timers.push(setTimeout(anzanAsk, t + 200));
}
function anzanAsk() {
  view('<div class="mid"><h1>Yig‘indi nechta?</h1><input id="ans" type="number" inputmode="numeric"></div><button class="big" onclick="anzanCheck()">Tekshirish</button>');
  $("ans").focus();
}
function anzanCheck() {
  var r = $("ans").value; if (r === "") return;
  playing = false;
  var ok = parseInt(r, 10) === tot, g = ok ? A.n * (A.d === 2 ? 3 : 1) + Math.round((2 - Math.min(A.sp, 2)) * 5) : 0;
  if (g) add(g);
  view('<div class="mid"><div style="font-size:70px">' + (ok ? "🎉" : "😅") + '</div><h1>' + (ok ? "To‘g‘ri! +" + g * (PREMIUM ? 2 : 1) + " tanga" : "Xato. To‘g‘ri javob: " + tot) + '</h1><div>' +
    seq.map(function (v, i) { return (i ? (v < 0 ? " − " : " + ") : "") + Math.abs(v); }).join("") + ' = ' + tot + '</div></div><button class="big" onclick="anzanSet()">🔁 Yana o‘ynash</button>');
}

/* ---------- Ilon va Arqon tortish ---------- */
function resultView(e, t, s, a, b) {
  playing = false;
  view('<div class="mid"><div style="font-size:70px">' + e + '</div><h1>' + t + '</h1><div>' + s + '</div></div><button class="big" onclick="' + a + '()">🔁 Yana o‘ynash</button><button class="back" style="margin-top:10px;text-align:center" onclick="' + b + '()">Orqaga</button>');
}
var G = {};
function free(x, y) {
  return !G.s.some(function (p) { return p[0] === x && p[1] === y; }) && !G.f.some(function (o) { return o.x === x && o.y === y; });
}
function snakeStart() {
  if (!gate()) return;
  stopAll(); playing = true;
  G = { C: 12, R: 14, s: [[6, 10], [6, 11], [6, 12]], d: [0, -1], nd: [0, -1], n: 0, f: [] };
  view(backBtn("home()") + '<div id="sq" style="text-align:center;font-size:28px;font-weight:900;margin:4px 0"></div><canvas id="cv"></canvas>' +
    '<div class="pad"><button onclick="dir(-1,0)">◀</button><button onclick="dir(0,-1)">▲</button><button onclick="dir(0,1)">▼</button><button onclick="dir(1,0)">▶</button></div>');
  var cv = $("cv"), w = $("view").clientWidth - 32, hh = $("view").clientHeight - 190;
  G.c = Math.max(16, Math.floor(Math.min(w / G.C, hh / G.R, 32))); cv.width = G.c * G.C; cv.height = G.c * G.R; G.x = cv.getContext("2d");
  var sx = 0, sy = 0;
  cv.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
  cv.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) dir(dx > 0 ? 1 : -1, 0); else dir(0, dy > 0 ? 1 : -1);
  });
  snakeQ(); draw();
  timers.push(setInterval(tick, 280));
}
function dir(x, y) { if (x === -G.d[0] && y === -G.d[1]) return; G.nd = [x, y]; }
function snakeQ() {
  var q = mathQ(); $("sq").textContent = q.p; G.f = [];
  q.o.forEach(function (v, k) { var x, y; do { x = rnd(0, G.C - 1); y = rnd(0, G.R - 1); } while (!free(x, y)); G.f.push({ x: x, y: y, v: v, ok: k === q.a }); });
}
function tick() {
  G.d = G.nd;
  var h = G.s[0], x = h[0] + G.d[0], y = h[1] + G.d[1];
  if (x < 0 || y < 0 || x >= G.C || y >= G.R || G.s.some(function (p) { return p[0] === x && p[1] === y; })) return snakeEnd();
  var f = null; G.f.forEach(function (o) { if (o.x === x && o.y === y) f = o; });
  if (f && !f.ok) return snakeEnd();
  G.s.unshift([x, y]);
  if (f) { G.n++; add(2); snakeQ(); } else G.s.pop();
  draw();
}
function rr(g, x, y, w, h, q) {
  g.beginPath(); g.moveTo(x + q, y); g.arcTo(x + w, y, x + w, y + h, q); g.arcTo(x + w, y + h, x, y + h, q); g.arcTo(x, y + h, x, y, q); g.arcTo(x, y, x + w, y, q); g.closePath(); g.fill();
}
function draw() {
  var c = G.c, g = G.x;
  g.fillStyle = "#1b1146"; g.fillRect(0, 0, c * G.C, c * G.R);
  g.font = "bold " + Math.floor(c * 0.6) + "px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  G.f.forEach(function (o) { g.fillStyle = "#fff"; rr(g, o.x * c + 1, o.y * c + 1, c - 2, c - 2, c * 0.25); g.fillStyle = "#2d1b78"; g.fillText(o.v, o.x * c + c / 2, o.y * c + c / 2); });
  var n = G.s.length;
  for (var i = n - 1; i >= 1; i--) {
    var p = G.s[i], pad = i === n - 1 ? c * 0.2 : c * 0.07;
    g.fillStyle = i % 2 ? "#22c55e" : "#16a34a";
    rr(g, p[0] * c + pad, p[1] * c + pad, c - 2 * pad, c - 2 * pad, c * 0.3);
  }
  var hd = G.s[0], hx = hd[0] * c, hy = hd[1] * c, cx = hx + c / 2, cy = hy + c / 2, dx = G.d[0], dy = G.d[1];
  g.strokeStyle = "#ef4444"; g.lineWidth = Math.max(2, c * 0.08);
  g.beginPath(); g.moveTo(cx + dx * c * 0.45, cy + dy * c * 0.45); g.lineTo(cx + dx * c * 0.85, cy + dy * c * 0.85); g.stroke();
  g.fillStyle = "#4ade80"; rr(g, hx + 1, hy + 1, c - 2, c - 2, c * 0.42);
  [-1, 1].forEach(function (k) {
    var ex = cx + dx * c * 0.15 + (-dy) * k * c * 0.22, ey = cy + dy * c * 0.15 + dx * k * c * 0.22;
    g.fillStyle = "#fff"; g.beginPath(); g.arc(ex, ey, c * 0.17, 0, 6.3); g.fill();
    g.fillStyle = "#111"; g.beginPath(); g.arc(ex + dx * c * 0.05, ey + dy * c * 0.05, c * 0.08, 0, 6.3); g.fill();
  });
}
function snakeEnd() {
  stopAll();
  resultView("🐍", G.n + " ta to‘g‘ri", "+" + G.n * 2 * (PREMIUM ? 2 : 1) + " tanga", "snakeStart", "home");
}

var T = {};
function tugStart() {
  if (!gate()) return;
  stopAll(); playing = true; T = { p: 0, lock: false, over: false };
  tugQ();
  timers.push(setInterval(function () { if (T.over) return; T.p--; tugRope(); }, 3500));
}
function tugQ() {
  if (T.over) return;
  var q = mathQ(); T.q = q; T.lock = false;
  var h = backBtn("home()") + '<div class="rope"><span>🧒</span><div class="track"><i id="fl">🚩</i></div><span>🤖</span></div><div class="q">' + q.p + '</div>';
  q.o.forEach(function (v, k) { h += '<button class="opt" id="t' + k + '" onclick="tugPick(' + k + ')">' + v + '</button>'; });
  view(h); tugRope();
}
function tugRope() {
  if ($("fl")) $("fl").style.left = (5 - T.p) * 10 + "%";
  if (T.p >= 5 || T.p <= -5) tugEnd(T.p >= 5);
}
function tugPick(k) {
  if (T.lock || T.over) return; T.lock = true;
  var ok = k === T.q.a;
  $("t" + k).className = "opt " + (ok ? "ok" : "no");
  if (!ok) $("t" + T.q.a).className = "opt ok";
  if (ok) { T.p++; add(1); } else T.p--;
  tugRope();
  if (!T.over) timers.push(setTimeout(tugQ, 700));
}
function tugEnd(win) {
  T.over = true; stopAll();
  if (win) add(10);
  resultView(win ? "🏆" : "🤖", win ? "Siz yutdingiz!" : "Kompyuter yutdi", win ? "+10 tanga bonus" : "Yana urinib ko‘ring", "tugStart", "home");
}
